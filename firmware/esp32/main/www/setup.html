  /* Setup portal in the Walkman LCD skin (see index.html). Served from the
     SoftAP with no internet behind it, so nothing external: the LCD8 font is
     embedded. The form posts plainly to /save and the script only enhances
     it, so a captive-portal mini-browser that runs no JS can still set the
     network. */
  :root {
    --shell: #c9cbc6; --shell-hi: #dadcd7; --shell-lo: #a9aba6;
    --print: #2b2d2c; --print-dim: #6a6d69;
    --bezel: #1c1d1f;
    --lcd: #b7bfa3; --ink: #1e2519; --dim: #55604a; --ghost: #a9b197;
    --key: #3a3c3f; --key-hi: #4c4f53; --key-txt: #e6e7e3;
    --accent: #d4492c; --amb: #e8a33a;
    --body: #e4e3dd;
    --sans: 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif;
    --lcdf: 'LCD8', ui-monospace, 'Consolas', monospace;
    color-scheme: light;
  }
  :root[data-theme="night"] {
    --shell: #2c2e31; --shell-hi: #393c40; --shell-lo: #1f2023;
    --print: #d8dad5; --print-dim: #8b8f8a;
    --bezel: #0b0c0d;
    --lcd: #121a12; --ink: #b9f08a; --dim: #6f9a52; --ghost: #1f2b1d;
    --key: #17181a; --key-hi: #232528; --key-txt: #d8dad5;
    --body: #17181a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--body); color: var(--print);
    font: 700 13px/1.3 var(--sans); font-stretch: condensed; letter-spacing: .08em; }
  button { font-family: inherit; cursor: pointer; } button:disabled { cursor: default; }
  .hidden { display: none !important; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }

  .shell { background: linear-gradient(180deg, var(--shell-hi), var(--shell) 18%, var(--shell) 82%, var(--shell-lo));
    border-radius: 22px; padding: 22px 26px 26px; margin-bottom: 18px;
    box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 -2px 0 rgba(0,0,0,.12) inset, 0 6px 18px rgba(0,0,0,.18); }
  .legend { display: flex; align-items: center; gap: 14px; text-transform: uppercase; margin: 0 4px 12px; flex-wrap: wrap; }
  .legend .name { font-size: 15px; letter-spacing: .28em; }
  .legend .model { font-style: italic; color: var(--print-dim); letter-spacing: .18em; }
  .legend .r { margin-left: auto; }

  .lcd { background: var(--bezel); border-radius: 10px; padding: 10px; }
  .field { background: var(--lcd); border-radius: 3px; padding: 12px 14px; position: relative; overflow: hidden;
    color: var(--ink); font: 400 16px/1 var(--lcdf); letter-spacing: 0; text-transform: uppercase;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.25); }
  .field::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .06;
    background: repeating-linear-gradient(0deg, #000 0 1px, transparent 1px 3px),
                repeating-linear-gradient(90deg, #000 0 1px, transparent 1px 3px); }
  :root[data-theme="night"] .field { box-shadow: inset 0 0 30px rgba(140,220,90,.08); }
  .ts { font-size: 16px; color: var(--dim); }
  .t  { font-size: 24px; }
  .tl { font-size: 32px; }

  /* Printed annunciator words: ghost until lit. */
  .anns { display: flex; gap: 14px; flex-wrap: wrap; padding-bottom: 8px; border-bottom: 1px solid var(--ghost); }
  .ann { color: var(--ghost); }
  .ann.on { color: var(--ink); }
  .ann.amb { color: var(--ink); animation: blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .15; } }

  /* Rubber keys: glyph on the cap, name printed underneath. */
  .keys { display: flex; flex-wrap: wrap; gap: 14px 12px; margin-top: 18px; }
  .key { appearance: none; border: 0; background: none; padding: 0; display: inline-flex; flex-direction: column;
    align-items: center; gap: 6px; color: var(--print); font: inherit; text-transform: uppercase; letter-spacing: .14em; white-space: nowrap; }
  .key > i { display: block; width: 74px; height: 30px; border-radius: 15px; position: relative; font-style: normal;
    background: linear-gradient(180deg, var(--key-hi), var(--key));
    box-shadow: 0 2px 0 rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.12) inset; transition: transform .05s; }
  .key:active:not(:disabled) > i { transform: translateY(2px); box-shadow: none; }
  .key > i > b { position: absolute; inset: 0; display: grid; place-items: center; color: var(--key-txt); font-size: 13px; letter-spacing: 0; }
  .key:disabled { opacity: .45; }
  .key.sm > i { width: 52px; }
  .led { position: absolute; top: 5px; right: 9px; width: 5px; height: 5px; border-radius: 50%; background: transparent; }
  .led.amb { background: var(--amb); box-shadow: 0 0 5px var(--amb); }
  .led.grn { background: #6fd36a; box-shadow: 0 0 5px #6fd36a; }
  .led.busy { animation: blink .8s steps(1) infinite; }

  /* ---- tuner: status + the networks the bridge can hear ---- */
  #msg { margin-top: 12px; font-size: 32px; min-height: 1em; word-break: break-word; }
  #msg.err { background: var(--ink); color: var(--lcd); padding: 2px 6px 0; display: inline-block; font-size: 24px; }
  #sub { margin-top: 8px; color: var(--dim); line-height: 1.3; text-transform: none; }
  #sub b { color: var(--ink); font-weight: 400; }
  .stations { margin-top: 12px; max-height: 300px; overflow-y: auto; scrollbar-color: var(--dim) var(--lcd); }
  .st { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto auto; align-items: center; gap: 10px;
        width: 100%; padding: 6px 4px; background: none; border: 0; border-bottom: 1px dashed var(--ghost);
        color: var(--ink); font: 400 24px var(--lcdf); text-align: left; text-transform: none; cursor: pointer; }
  .st:last-child { border-bottom: 0; }
  .st:hover, .st.sel { background: var(--ink); color: var(--lcd); }
  .st:hover .pre, .st:hover .ch, .st.sel .pre, .st.sel .ch { color: var(--lcd); }
  .st .pre, .st .ch { font-size: 16px; color: var(--dim); }
  .st .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st .lock { font-size: 16px; margin-left: 8px; }
  .bars { display: flex; gap: 2px; align-items: flex-end; height: 16px; }
  .bars i { width: 5px; background: var(--ghost); }
  .bars i:nth-child(1) { height: 25%; } .bars i:nth-child(2) { height: 50%; } .bars i:nth-child(3) { height: 75%; } .bars i:nth-child(4) { height: 100%; }
  .bars i.on { background: currentColor; }
  .st:hover .bars i:not(.on), .st.sel .bars i:not(.on) { background: var(--dim); }
  .empty { padding: 10px 4px; color: var(--dim); font-size: 24px; }

  /* ---- entry: network name / password ---- */
  .entry { display: block; margin-top: 4px; }
  .entry + .entry { margin-top: 16px; }
  .entry .ts { display: block; margin-bottom: 6px; }
  .inrow { display: flex; gap: 12px; align-items: flex-end; }
  .inrow input { flex: 1; min-width: 0; }
  .lcdinput { font: 400 24px var(--lcdf); background: transparent; border: 0; border-bottom: 2px solid var(--ink); color: var(--ink);
    width: 100%; outline: none; padding: 2px 0; }
  .lcdinput::placeholder { color: var(--ghost); text-transform: uppercase; }
  .lcdinput:focus { border-bottom-width: 3px; }
  .reveal { appearance: none; border: 0; background: none; padding: 0; color: var(--ink); font: 400 16px var(--lcdf); text-transform: uppercase; cursor: pointer; }
  .savekey > i { width: 120px; }
  .plate { margin-top: 16px; color: var(--print-dim); letter-spacing: .12em; font-weight: 400; text-transform: uppercase; }
  .plate b { color: var(--print); }
  .foot { text-align: center; color: var(--print-dim); margin-top: 6px; letter-spacing: .2em; font-weight: 400; text-transform: uppercase; }

  @media (max-width: 640px) {
    .wrap { padding: 12px 10px 30px; }
    .shell { padding: 16px 14px 18px; border-radius: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 1 · tuner: status + the networks the bridge can hear -->
  <section class="shell">
    <div class="legend"><span class="name">WI-FI SETUP</span><span class="model">GW-WIFI</span>
      <span class="r"><button class="key sm" id="themeToggle" type="button" title="Day (reflective) / night (backlit)"><i><b>&#9788;</b></i><span>LIGHT</span></button></span></div>
    <div class="lcd"><div class="field">
      <div class="anns ts"><span class="ann amb" id="aSetup">SETUP</span><span class="ann" id="aScan">SCAN</span><span class="ann" id="aSel">TUNED</span><span class="ann" id="aSave">SAVED</span></div>
      <div id="msg">PICK YOUR NETWORK</div>
      <div class="ts" id="sub">Choose a network below or type its name. The bridge reboots, joins it,
        and then appears at <b id="host">floppy.local</b>.</div>
      <div class="stations" id="stations"><div class="empty">SCANNING…</div></div>
    </div></div>
    <div class="keys">
      <button class="key" id="scan" type="button"><i><b>&#8635;</b><span class="led"></span></i><span>SCAN AGAIN</span></button>
    </div>
  </section>

  <!-- 2 · entry: works as a plain form with no script at all -->
  <section class="shell">
    <div class="legend"><span class="name">NETWORK</span></div>
    <form method="POST" action="/save" id="form">
      <div class="lcd"><div class="field">
        <label class="entry"><span class="ts">NETWORK NAME (SSID)</span>
          <input class="lcdinput" name="ssid" id="ssid" maxlength="32" required autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="network name"></label>
        <label class="entry"><span class="ts">PASSWORD</span>
          <span class="inrow"><input class="lcdinput" name="pass" id="pass" type="password" maxlength="64" autocomplete="off" placeholder="blank if open">
            <button class="reveal" id="reveal" type="button">SHOW</button></span></label>
      </div></div>
      <div class="keys">
        <button class="key savekey" id="save" type="submit"><i><b>&#9654; SAVE</b><span class="led"></span></i><span>SAVE &amp; REBOOT</span></button>
      </div>
    </form>
    <div class="plate">MODEL GW-WIFI · S/N <b id="sn">—</b> · RP2354 + ESP32-S3</div>
  </section>

  <div class="foot">gw-wifi · setup network</div>
</div>

<script>
const $ = s => document.querySelector(s);
const ssid = $('#ssid'), pass = $('#pass'), msg = $('#msg'), sub = $('#sub'), list = $('#stations'), scanBtn = $('#scan');
const ann = (id, cls) => { $(id).className = 'ann' + (cls ? ' ' + cls : ''); };
const say = (t, cls = '') => { msg.textContent = t; msg.className = cls; };
const led = (btn, cls) => { btn.querySelector('.led').className = 'led' + (cls ? ' ' + cls : ''); };

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#themeToggle b').textContent = t === 'night' ? '☾' : '☼';
  try { localStorage.setItem('floppy-lcd-theme', t); } catch (e) {}
}
let saved = 'day';
try { saved = localStorage.getItem('floppy-lcd-theme') || 'day'; } catch (e) {}
setTheme(saved === 'night' ? 'night' : 'day');
$('#themeToggle').onclick = () => setTheme(document.documentElement.dataset.theme === 'night' ? 'day' : 'night');

$('#reveal').onclick = () => { const show = pass.type === 'password'; pass.type = show ? 'text' : 'password'; $('#reveal').textContent = show ? 'HIDE' : 'SHOW'; };

// RSSI -> 0..4 bars, the usual phone thresholds.
const bars = r => r >= -55 ? 4 : r >= -65 ? 3 : r >= -75 ? 2 : r >= -85 ? 1 : 0;

function render(nets) {
  list.innerHTML = '';
  if (!nets.length) { list.innerHTML = '<div class="empty">NO NETWORKS FOUND — TYPE THE NAME BELOW</div>'; return; }
  nets.forEach((n, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'st' + (n.ssid === ssid.value ? ' sel' : '');
    const pre = document.createElement('span'); pre.className = 'pre'; pre.textContent = String(i + 1).padStart(2, '0');
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = n.ssid;
    if (n.lock) { const l = document.createElement('span'); l.className = 'lock'; l.textContent = '[PW]'; l.title = 'password protected'; nm.appendChild(l); }
    const ch = document.createElement('span'); ch.className = 'ch'; ch.textContent = 'CH ' + n.ch;
    const m = document.createElement('span'); m.className = 'bars'; m.title = n.rssi + ' dBm';
    for (let k = 1; k <= 4; k++) { const i2 = document.createElement('i'); if (k <= bars(n.rssi)) i2.className = 'on'; m.appendChild(i2); }
    b.append(pre, nm, ch, m);
    b.onclick = () => {
      ssid.value = n.ssid; ann('#aSel', 'on');
      list.querySelectorAll('.st').forEach(x => x.classList.toggle('sel', x === b));
      say('TUNED · ' + n.ssid.toUpperCase());
      if (n.lock) pass.focus(); else { pass.value = ''; $('#save').focus(); }
    };
    list.appendChild(b);
  });
}

async function scan(fresh) {
  scanBtn.disabled = true; ann('#aScan', 'amb'); led(scanBtn, 'amb busy');
  try {
    const j = await (await fetch('/scan' + (fresh ? '?fresh=1' : ''), { cache: 'no-store' })).json();
    if (j.sn) $('#sn').textContent = j.sn;
    if (j.host) $('#host').textContent = j.host + '.local';
    // One row per network name, strongest access point wins.
    const best = new Map();
    for (const n of j.nets || []) if (n.ssid && (!best.has(n.ssid) || best.get(n.ssid).rssi < n.rssi)) best.set(n.ssid, n);
    render([...best.values()].sort((a, b) => b.rssi - a.rssi));
  } catch (e) {
    list.innerHTML = '<div class="empty">SCAN UNAVAILABLE — TYPE THE NAME BELOW</div>';
  }
  scanBtn.disabled = false; ann('#aScan', ''); led(scanBtn, '');
}
scanBtn.onclick = () => scan(true);
ssid.oninput = () => { ann('#aSel', ssid.value ? 'on' : ''); list.querySelectorAll('.st').forEach(x => x.classList.remove('sel')); };

$('#form').onsubmit = async e => {
  e.preventDefault();
  if (!ssid.value) { ssid.focus(); return; }
  const save = $('#save'); save.disabled = true; led(save, 'amb busy');
  say('SAVING…');
  // Only the request can fail here: once /save answers OK the credentials are
  // stored and the bridge is rebooting, so nothing after it may report failure.
  try {
    const r = await fetch('/save', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                                     body: new URLSearchParams({ ssid: ssid.value, pass: pass.value }) });
    if (!r.ok) throw new Error((await r.text()) || 'HTTP ' + r.status);
  } catch (err) {
    say('NOT SAVED · ' + err.message.toUpperCase(), 'err');
    save.disabled = false; led(save, '');
    return;
  }
  const host = $('#host').textContent;   // read before #sub (its parent) is rewritten
  ann('#aSave', 'on'); ann('#aSetup', ''); led(save, 'grn');
  say('SAVED · REBOOTING');
  sub.innerHTML = '';
  sub.append('The bridge is joining ', Object.assign(document.createElement('b'), { textContent: ssid.value }),
             '. Put this phone back on that network, then open ',
             Object.assign(document.createElement('b'), { textContent: host }), '.');
  list.innerHTML = ''; scanBtn.disabled = true;
};

scan();
</script>
</body>
</html>
