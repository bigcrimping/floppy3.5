; SECONDARY build path — the primary is plain pico-sdk CMake (CMakeLists.txt),
; per the build-system decision for this variant: RP2350 support is official
; and exercised in the SDK's CMake flow, while PlatformIO RP2350 support rides
; the community platform fork (unpinned below; the dev machine was
; network-restricted). If you use this at all:
;   1. Pin the platform to a commit SHA at the first successful build.
;   2. Confirm the picosdk framework builder handles RP2350 + TinyUSB-without-
;      stdio-USB and .pio header generation (bring-up risk R1 in the RP2040
;      tree applies here with a newer, less-exercised target on top).
; When in doubt: cmake -S firmware/rp2354 -B firmware/rp2354/build && cmake
; --build firmware/rp2354/build  (requires PICO_SDK_PATH). The .uf2 is what
; matters — both routes produce one.

[platformio]
src_dir = .
default_envs = gw_rp2354a

[env:gw_rp2354a]
; TODO pin (#<sha>) at first bench build; do not guess a SHA.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2            ; closest stock board (RP2350A/4MB) — the custom
                            ; RP2350A/2MB identity comes from the flash-size override:
board_build.flash_size = 2MB
framework = picosdk

build_src_filter =
    +<src/>

build_flags =
    -std=gnu11
    -DCFG_TUSB_OS=OPT_OS_PICO
    -DPICO_RP2350A=1        ; RP2350A variant (30 GPIOs)
    -DPICO_FLASH_SIZE_BYTES=2097152
    -Isrc
    -DGW_BUILD_ID=\"pio\"

monitor_speed = 115200
